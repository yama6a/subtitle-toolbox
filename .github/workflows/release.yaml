# Tags a release on every merge to master. Packagist reads the tag through its GitHub webhook.
name: release

on:
  push:
    branches: [master]

# Serialised so two runs cannot tag the same version. A cancelled run here loses nothing:
# the next one recomputes the bump from every PR merged since the last release.
concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write # create the tag and the GitHub release

jobs:
  release:
    uses: yama6a/gha/.github/workflows/php-release.yaml@php-workflows
