# Tags a release on every merge to master. Packagist reads the tag through its GitHub webhook.
name: release

on:
  push:
    branches: [master]

# Serialised so two runs cannot tag the same version. A cancelled run here loses nothing:
# the next one recomputes the bump from every PR merged since the last release.
concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write # create the tag and the GitHub release

jobs:
  release:
    runs-on: ubuntu-26.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # the tag list is the version history

      - name: Resolve bump since the last release
        id: bump
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # Tags carry no v prefix, as on Packagist since 0.1.0.
          latest=$(git tag -l --sort=-v:refname | grep -E '^[0-9]+\.[0-9]+\.[0-9]+$' | head -1 || true)
          range="${latest:+${latest}..}HEAD"

          labels=""
          for sha in $(git rev-list "$range"); do
            labels+=$(gh api "repos/${GITHUB_REPOSITORY}/commits/${sha}/pulls" \
              --jq '.[0].labels[]?.name' 2>/dev/null || true)$'\n'
          done

          # Strongest bump in the batch wins. skip-release only suppresses when nothing
          # else in the backlog asked for a release.
          kind=none
          for want in patch minor major; do
            grep -qx "$want" <<<"$labels" && kind=$want
          done

          echo "since ${latest:-<start>}: ${kind}"
          echo "latest=${latest:-0.0.0}" >> "$GITHUB_OUTPUT"
          echo "kind=${kind}" >> "$GITHUB_OUTPUT"

      - name: Tag and release
        if: steps.bump.outputs.kind != 'none'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          KIND: ${{ steps.bump.outputs.kind }}
          LATEST: ${{ steps.bump.outputs.latest }}
        run: |
          set -euo pipefail
          IFS=. read -r major minor patch <<<"$LATEST"
          case "$KIND" in
            major) major=$((major + 1)); minor=0; patch=0 ;;
            minor) minor=$((minor + 1)); patch=0 ;;
            patch) patch=$((patch + 1)) ;;
          esac
          version="${major}.${minor}.${patch}"
          echo "${LATEST} + ${KIND} -> ${version}"
          gh release create "$version" --target "$GITHUB_SHA" --title "$version" --generate-notes
